name: Seoul rain alert
run-name: ${{ inputs.dry_run && 'Seoul rain alert (dry run)' || 'Seoul rain alert' }}
on:
  # 정시 실행은 외부 크론(cron-job.org 등)이 09:00 KST에 workflow_dispatch를 호출한다.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램 전송 없이 결과만 확인"
        type: boolean
        default: false
  # GitHub schedule은 지연·누락될 수 있어 백업으로만 쓴다(UTC).
  # 그날 이미 성공한 실행이 있으면 건너뛴다.
  schedule:
    - cron: "13 0 * * *" # 09:13 KST
    - cron: "47 0 * * *" # 09:47 KST
    - cron: "27 1 * * *" # 10:27 KST
permissions:
  actions: read
  contents: read
concurrency:
  group: seoul-rain-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip if today's alert already ran
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          count=$(gh run list -R "$GITHUB_REPOSITORY" --workflow monitor.yml --status success --limit 20 \
            --json createdAt,displayTitle \
            --jq "[.[] | select(.displayTitle == \"Seoul rain alert\") | .createdAt | fromdateiso8601 | . + 32400 | strftime(\"%Y-%m-%d\") | select(. == \"$today\")] | length")
          echo "successful runs today (KST $today): $count"
          if [ "$count" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.dedupe.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Unit tests
        if: steps.dedupe.outputs.skip != 'true'
        run: python -m unittest discover -s tests
      - name: Collect forecasts and notify
        if: steps.dedupe.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          LOCATION_NAME: ${{ vars.LOCATION_NAME }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          THRESHOLD_MM: ${{ vars.THRESHOLD_MM }}
          ALERT_ONLY: ${{ vars.ALERT_ONLY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python -u scripts/rain_alert.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.dedupe.outputs.skip != 'true'
        with:
          name: rain-report-${{ github.run_id }}
          path: out/report.json
          if-no-files-found: ignore
          retention-days: 30
