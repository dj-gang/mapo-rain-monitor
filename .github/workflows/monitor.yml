name: Mapo rain monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST
    - cron: "0 9 * * *"  # 18:00 KST
permissions:
  contents: write
concurrency:
  group: mapo-rain-monitor
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts
        run: python scripts/monitor.py
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Update Mapo rainfall forecast report"
            git push
          fi
