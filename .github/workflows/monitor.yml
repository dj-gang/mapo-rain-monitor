name: Mapo rain monitor
on:
  workflow_dispatch:
  schedule:
    # Keep 10-minute debug runs and also run the requested daily report slots (GitHub cron uses UTC).
    - cron: "*/10 * * * *"
    - cron: "5 22 * * *" # 07:05 KST
    - cron: "5 9 * * *"  # 18:05 KST
permissions:
  contents: write
concurrency:
  group: mapo-rain-monitor
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime and schedule diagnostics
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "DIAG run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT event=$GITHUB_EVENT_NAME ref=$GITHUB_REF_NAME sha=$GITHUB_SHA"
          echo "DIAG runner_utc=$(date -u --iso-8601=seconds) runner_kst=$(TZ=Asia/Seoul date --iso-8601=seconds)"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "DIAG telegram_token_present=true"; else echo "DIAG telegram_token_present=false"; fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then echo "DIAG telegram_chat_id_present=true"; else echo "DIAG telegram_chat_id_present=false"; fi
          echo "DIAG secret values are intentionally not printed."
          echo "DIAG event payload:"
          python -c 'import json,os; p=os.environ.get("GITHUB_EVENT_PATH"); d=json.load(open(p)) if p else {}; print(json.dumps({k:d.get(k) for k in ("schedule","workflow","ref","repository") if k in d}))'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts
        id: fetch_forecasts
        run: |
          set -o pipefail
          mkdir -p reports
          python -u scripts/monitor.py 2>&1 | tee reports/debug-monitor.log
      - name: Commit latest report
        id: commit_report
        run: |
          echo "DIAG git status before report commit:"
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          echo "DIAG staged diff summary:"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "DIAG report files unchanged; no commit required"
          else
            git commit -m "Update Mapo rainfall forecast report"
            echo "DIAG commit created: $(git rev-parse HEAD)"
            git push
            echo "DIAG git push succeeded"
          fi
          echo "DIAG report file metadata:"
          ls -l --time-style=long-iso reports/latest.md reports/latest.json
      - name: Send formatted report to Telegram
        id: send_report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram secrets missing. Report generated but cannot be sent."
            exit 1
          fi
          python - <<'PY'
          import html, json, os, sys, time, urllib.request
          from urllib.error import HTTPError, URLError
          from pathlib import Path

          started = time.monotonic()
          print("DIAG telegram_payload_read_start", flush=True)
          report_path = Path("reports/latest.json")
          if not report_path.exists():
              raise FileNotFoundError("reports/latest.json missing before Telegram send")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"DIAG report_loaded bytes={report_path.stat().st_size} generated_at_kst={report.get('generated_at_kst')} status={report.get('status')} model_count={len(report.get('models', {}))} failed_model_count={len(report.get('failed_models', {}))}", flush=True)
          models = report.get("models", {})
          failures = report.get("failed_models", {})
          model_order = [
              ("ecmwf_ifs025", "ECMWF"),
              ("ncep_gfs_global", "GFS"),
              ("icon_global", "ICON"),
              ("kma_gdps", "KMA"),
              ("gem_global", "GEM"),
          ]
          successful = [(key, label) for key, label in model_order if key in models]
          events = report.get("threshold_events", [])
          messages = []
          status = report.get("status", "판정 불가")
          stamp = report.get("generated_at_kst", "확인 불가").replace("T", " ")

          # 1) Alert first, with the contractor message ready to copy.
          if events:
              lines = ["🚨 <b>마포구 강수 임계치 충족</b>", f"확인: <code>{html.escape(stamp)}</code>", ""]
              for e in events:
                  when = e.get("time", e.get("date", "시각 확인 불가"))
                  if e.get("type") == "hourly":
                      desc = f"시간당 <b>{e.get('mm')}mm</b>"
                  else:
                      desc = f"일 누적 <b>{e.get('mm')}mm</b>"
                  lines.append(f"• {html.escape(e.get('model','모델'))} · {html.escape(when)} · {desc}")
              first = events[0]
              when = first.get("time", first.get("date", "일시 확인 필요"))
              amount = first.get("mm", "확인 불가")
              if first.get("type") == "hourly":
                  contractor = f"마포구 {when} 시간당 최대 {amount}mm 예보({first.get('model')}), 지하1층 누수 점검 대기 부탁드립니다."
              else:
                  contractor = f"마포구 {when} 일강수량 {amount}mm 예보({first.get('model')}), 지하1층 누수 점검 대기 부탁드립니다."
              lines += ["", "📩 <b>시공업체 전달 문구</b>", f"<code>{html.escape(contractor)}</code>"]
              messages.append("\n".join(lines))
          else:
              icon = "✅" if status == "기준 미충족" else "⚠️"
              messages.append(f"{icon} <b>마포구 7일 강수 모니터링</b>\n판정: <b>{html.escape(status)}</b>\n확인: <code>{html.escape(stamp)}</code>")

          # 2) A compact, phone-friendly 7-day table: daily rainfall by model.
          # Telegram has no native Markdown tables; HTML <pre> keeps columns aligned.
          dates = sorted({row.get("date") for _, _label in successful
                          for row in models[_]["analysis"].get("daily", []) if row.get("date")})
          labels = [label for _key, label in successful]
          header = "날짜     " + " ".join(f"{label:>6}" for label in labels)
          table = [header, "-" * len(header)]
          for date in dates:
              vals = []
              rain_by_model = {}
              for key, label in successful:
                  rows = models[key]["analysis"].get("daily", [])
                  match = next((r for r in rows if r.get("date") == date), None)
                  val = match.get("precipitation_mm") if match else None
                  rain_by_model[label] = val
                  if val is None:
                      vals.append("   —")
                  else:
                      # Precipitation cannot be negative; clamp tiny model artifacts to 0.0.
                      vals.append(f"{max(0.0, float(val)):5.1f}")
              marker = "🚨" if any(v is not None and v >= 20 for v in rain_by_model.values()) else "  "
              table.append(f"{date[5:]} {marker}" + " ".join(vals))
          legend = "강수량 mm | " + "  ".join(labels)
          table_text = "<pre>" + html.escape("\n".join(table)) + "</pre>"
          summary = [
              f"📊 <b>7일 예보표 · 마포구</b>",
              f"상태: <b>{html.escape(status)}</b> · 모델 {len(successful)}/5개 응답",
              f"<code>{html.escape(stamp)} KST</code>",
              table_text,
              html.escape(legend),
              "🚨 = 일강수량 20mm 이상",
              "",
              "<b>기온·강수확률 범위(모델 간)</b>",
          ]
          for date in dates:
              rows = []
              for key, _label in successful:
                  row = next((r for r in models[key]["analysis"].get("daily", []) if r.get("date") == date), None)
                  if row:
                      rows.append(row)
              lows = [r.get("temperature_min_c") for r in rows if r.get("temperature_min_c") is not None]
              highs = [r.get("temperature_max_c") for r in rows if r.get("temperature_max_c") is not None]
              probs = [r.get("precipitation_probability_max_pct") for r in rows if r.get("precipitation_probability_max_pct") is not None]
              temp = f"{min(lows):.1f}–{max(highs):.1f}°C" if lows and highs else "확인 불가"
              prob = f"{min(probs)}–{max(probs)}%" if probs else "확인 불가"
              summary.append(f"• {date}: {temp} · 강수확률 {prob}")
          if failures:
              summary += ["", "⚠️ <b>응답 실패</b>"]
              for key, err in failures.items():
                  summary.append(f"• {html.escape(key)}: {html.escape(err[:180])}")
          summary += ["", f'원자료·상세표: <a href="https://github.com/dj-gang/mapo-rain-monitor/blob/main/reports/latest.md">GitHub 상세 보고서</a>']
          messages.append("\n".join(summary))

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          print(f"DIAG telegram_messages_prepared count={len(messages)} lengths={[len(m) for m in messages]}", flush=True)
          for index, message in enumerate(messages, 1):
              # Stay comfortably under Telegram's 4096-character message limit.
              if len(message) > 3900:
                  message = message[:3850] + "\n… (상세 보고서는 GitHub 링크 참고)"
              body = json.dumps({
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.loads(response.read().decode())
                      print(f"DIAG telegram_response message={index}/{len(messages)} http_status={response.status} api_ok={result.get('ok')} message_id={result.get('result', {}).get('message_id')} elapsed_s={time.monotonic()-started:.2f}", flush=True)
                      if not result.get("ok"):
                          raise RuntimeError(f"Telegram API ok=false description={result.get('description', 'no description')}")
              except HTTPError as exc:
                  body_text = exc.read().decode("utf-8", errors="replace")[:1000]
                  print(f"DIAG telegram_http_error message={index} http_status={exc.code} response={body_text}", file=sys.stderr, flush=True)
                  raise
              except (URLError, TimeoutError) as exc:
                  print(f"DIAG telegram_transport_error message={index} type={type(exc).__name__} detail={exc}", file=sys.stderr, flush=True)
                  raise
          print(f"DIAG telegram_delivery_complete messages={len(messages)} elapsed_total_s={time.monotonic()-started:.2f}", flush=True)
          PY

      - name: Upload debug logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mapo-rain-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/debug-monitor.log
            reports/latest.md
            reports/latest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Write diagnostic summary
        if: ${{ always() }}
        env:
          FETCH_OUTCOME: ${{ steps.fetch_forecasts.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_report.outcome }}
          SEND_OUTCOME: ${{ steps.send_report.outcome }}
        run: |
          {
            echo "## Mapo rain monitor diagnostics"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- UTC: $(date -u --iso-8601=seconds)"
            echo "- KST: $(TZ=Asia/Seoul date --iso-8601=seconds)"
            echo "- Forecast step: $FETCH_OUTCOME"
            echo "- Report commit step: $COMMIT_OUTCOME"
            echo "- Telegram step: $SEND_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Notify Telegram on workflow failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORECAST_OUTCOME: ${{ steps.fetch_forecasts.outcome }}
          REPORT_SEND_OUTCOME: ${{ steps.send_report.outcome }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Cannot send failure alert because Telegram secrets are missing."
            exit 0
          fi
          python - <<'PY'
          import html, json, os, urllib.request

          workflow = os.environ.get("GITHUB_WORKFLOW", "Mapo rain monitor")
          repo = os.environ.get("GITHUB_REPOSITORY", "dj-gang/mapo-rain-monitor")
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          ref = os.environ.get("GITHUB_REF_NAME", "unknown")
          base = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          forecast_outcome = os.environ.get("FORECAST_OUTCOME", "unknown")
          send_outcome = os.environ.get("REPORT_SEND_OUTCOME", "unknown")
          run_url = f"{base}/{repo}/actions/runs/{run_id}"
          if forecast_outcome == "failure":
              category = "예보 수집/분석 실패"
              detail = "예보 API 또는 보고서 생성 단계에서 실패했습니다."
          elif send_outcome == "failure":
              category = "텔레그램 보고서 전송 실패"
              detail = "예보 처리 후 텔레그램 전송이 실패했습니다. 봇 토큰·채팅 ID·Telegram API 응답을 확인하세요."
          else:
              category = "워크플로 내부 단계 실패"
              detail = "커밋 또는 다른 작업 단계가 실패했습니다."
          message = (
              f"❌ <b>마포구 모니터링: {html.escape(category)}</b>\n"
              f"{html.escape(detail)}\n"
              f"브랜치: <code>{html.escape(ref)}</code> · 시도: {html.escape(attempt)}\n"
              f'오류 로그: <a href="{html.escape(run_url, quote=True)}">GitHub Actions 실행 기록 열기</a>'
          )
          body = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.loads(response.read().decode())
              if not result.get("ok"):
                  raise RuntimeError("Telegram API returned ok=false")
          print("Telegram failure alert sent.")
          PY
