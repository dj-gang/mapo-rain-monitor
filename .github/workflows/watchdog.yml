name: Mapo rain monitor watchdog
on:
  schedule:
    - cron: "20 22 * * *" # 07:20 KST - check the 07:05 scheduled run
    - cron: "20 9 * * *"  # 18:20 KST - check the 18:05 scheduled run
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  check-scheduled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect missing scheduled run and notify Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "DIAG watchdog_run_id=$GITHUB_RUN_ID event=$GITHUB_EVENT_NAME utc=$(date -u --iso-8601=seconds) kst=$(TZ=Asia/Seoul date --iso-8601=seconds)"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "DIAG watchdog_telegram_token_present=true"; else echo "DIAG watchdog_telegram_token_present=false"; fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then echo "DIAG watchdog_telegram_chat_id_present=true"; else echo "DIAG watchdog_telegram_chat_id_present=false"; fi
          python -u - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          now = dt.datetime.now(dt.timezone.utc)
          # Watchdog schedules at 09:20Z and 22:20Z, 15 minutes after
          # the expected report run (09:05Z / 22:05Z).
          if now.hour in (9, 10):
              target_hour = 9
              slot = "저녁 18:05 KST"
          elif now.hour in (22, 23):
              target_hour = 22
              slot = "오전 07:05 KST"
          else:
              print(f"Manual or unexpected watchdog run at {now.isoformat()}; no slot check.")
              raise SystemExit(0)

          target = now.replace(hour=target_hour, minute=0, second=0, microsecond=0)
          # If execution is delayed past UTC midnight, use the previous day's target.
          if target > now:
              target -= dt.timedelta(days=1)
          params = urllib.parse.urlencode({
              "per_page": "100",
              "event": "schedule"
          })
          api_url = f"https://api.github.com/repos/{repo}/actions/workflows/monitor.yml/runs?{params}"
          req = urllib.request.Request(api_url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          runs = data.get("workflow_runs", [])
          print(f"DIAG api_runs_returned={len(runs)} target_slot={slot} target_utc={target.isoformat()} now_utc={now.isoformat()}", flush=True)
          window_start = target - dt.timedelta(minutes=2)
          window_end = target + dt.timedelta(minutes=18)
          print(f"DIAG expected_run_window_start={window_start.isoformat()} expected_run_window_end={window_end.isoformat()}", flush=True)
          candidates = []
          for run in runs:
              created = dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if run.get("event") == "schedule" and window_start <= created <= window_end:
                  print(f"DIAG observed_run id={run.get('id')} event={run.get('event')} created_at={run.get('created_at')} status={run.get('status')} conclusion={run.get('conclusion')}", flush=True)
              candidates.append(run)

          if candidates:
              latest = max(candidates, key=lambda r: r["created_at"])
              print(f"DIAG SCHEDULE_CHECK=FOUND id={latest['id']} status={latest['status']} conclusion={latest.get('conclusion')} url={latest.get('html_url')}", flush=True)
              # A started run is not a missed trigger. The monitor workflow sends its own
              # categorized failure notification if a step fails.
              raise SystemExit(0)

          print(f"DIAG SCHEDULE_CHECK=MISSING slot={slot}; sending missing-run alert.", flush=True)
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not bot_token or not chat_id:
              raise SystemExit("Telegram secrets are missing; cannot send missed-run alert.")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/{repo}/actions"
          message = (
              "🚨 <b>마포구 강수 모니터링 예약 실행 누락</b>\n"
              f"확인 대상: <b>{slot}</b>\n"
              f"확인 시각(UTC): <code>{now.strftime('%Y-%m-%d %H:%M')}</code>\n"
              "예정된 예약 실행 기록을 찾지 못했습니다. 이번 회차 보고서가 전송되지 않았을 수 있습니다.\n"
              f'실행 기록: <a href="{run_url}">GitHub Actions 열기</a>'
          )
          body = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              raw = response.read().decode("utf-8")
              result = json.loads(raw)
              print(f"DIAG watchdog_telegram_response http_status={response.status} api_ok={result.get('ok')} message_id={result.get('result', {}).get('message_id')}", flush=True)
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram API returned ok=false description={result.get('description', 'unknown')}")
          print("DIAG watchdog_alert_delivery=SUCCESS", flush=True)
          PY
