name: Mapo rain monitor watchdog
on:
  # TEMP DEBUG ONLY: check for missed 10-minute monitor runs during verification.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  check-scheduled-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect missing scheduled run and notify Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "DIAG watchdog_run_id=$GITHUB_RUN_ID event=$GITHUB_EVENT_NAME utc=$(date -u --iso-8601=seconds) kst=$(TZ=Asia/Seoul date --iso-8601=seconds)"
          python -u - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          now = dt.datetime.now(dt.timezone.utc)
          # During debug mode, expect the monitor to run every 10 minutes.
          # Allow 20 minutes for GitHub's scheduled-run delays before alerting.
          grace = dt.timedelta(minutes=20)
          params = urllib.parse.urlencode({"per_page": "100", "event": "schedule"})
          api_url = f"https://api.github.com/repos/{repo}/actions/workflows/monitor.yml/runs?{params}"
          req = urllib.request.Request(api_url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          runs = [r for r in data.get("workflow_runs", []) if r.get("event") == "schedule"]
          parsed = []
          for run in runs:
              raw = run.get("run_started_at") or run.get("created_at")
              if not raw:
                  continue
              stamp = dt.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              parsed.append((stamp, run))
          latest = max(parsed, key=lambda x: x[0]) if parsed else None
          print(f"DIAG monitor_schedule_runs_returned={len(runs)} now_utc={now.isoformat()} grace_minutes={int(grace.total_seconds()/60)}", flush=True)
          if latest:
              stamp, run = latest
              age = now - stamp
              print(f"DIAG latest_monitor_run id={run.get('id')} at={stamp.isoformat()} age_minutes={age.total_seconds()/60:.1f} status={run.get('status')} conclusion={run.get('conclusion')} url={run.get('html_url')}", flush=True)
              if age <= grace:
                  print("DIAG SCHEDULE_CHECK=FOUND recent scheduled monitor run exists.", flush=True)
                  raise SystemExit(0)

          latest_text = "기록 없음" if not latest else latest[0].astimezone(dt.timezone(dt.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M KST")
          print("DIAG SCHEDULE_CHECK=MISSING; sending missing-run alert.", flush=True)
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not bot_token or not chat_id:
              raise SystemExit("Telegram secrets are missing; cannot send missed-run alert.")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/{repo}/actions"
          message = (
              "🚨 <b>마포구 강수 모니터링 자동 실행 누락 의심</b>\n"
              "확인 대상: <b>10분 간격 테스트 실행</b>\n"
              f"확인 시각: <code>{now.astimezone(dt.timezone(dt.timedelta(hours=9))).strftime('%Y-%m-%d %H:%M KST')}</code>\n"
              f"마지막 예약 실행: <code>{latest_text}</code>\n"
              f"최근 {int(grace.total_seconds()/60)}분 내 예약 실행 기록이 없습니다. GitHub Actions 지연/누락 여부를 확인하세요.\n"
              f'<a href="{run_url}">GitHub Actions 실행 기록 열기</a>'
          )
          body = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))
              print(f"DIAG watchdog_telegram_response http_status={response.status} api_ok={result.get('ok')} message_id={result.get('result', {}).get('message_id')}", flush=True)
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram API returned ok=false description={result.get('description', 'unknown')}")
          print("DIAG watchdog_alert_delivery=SUCCESS", flush=True)
          PY
